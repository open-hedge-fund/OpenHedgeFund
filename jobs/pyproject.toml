[project]
name = "openhedgefund-jobs"
version = "0.1.0"
description = "OpenHedgeFund Job Server"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
