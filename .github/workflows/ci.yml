name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openhedgefund
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: openhedgefund_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: api
        run: pip install ".[dev]"
      - name: Lint
        working-directory: api
        run: ruff check .
      - name: Test
        working-directory: api
        env:
          DATABASE_URL: postgresql+asyncpg://openhedgefund:testpass@localhost:5432/openhedgefund_test
          SECRET_KEY: test-secret-key
        run: pytest

  # ui:
