[project]
name = "openhedgefund-api"
version = "0.1.0"
description = "OpenHedgeFund API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi-users[sqlalchemy]>=14.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "celery[redis]>=5.4",
    "httpx>=0.28",
    "redis>=5.0",
    "pandas>=2.0",
    "openhedgefund-common @ file:///../shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
