services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openhedgefund
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: openhedgefund
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhedgefund"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://openhedgefund:localdev@db:5432/openhedgefund
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src

  jobs-worker:
    build:
      context: .
      dockerfile: jobs/Dockerfile
    command: celery -A src.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://openhedgefund:localdev@db:5432/openhedgefund
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./jobs/src:/app/src

  jobs-beat:
    build:
      context: .
      dockerfile: jobs/Dockerfile
    command: celery -A src.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://openhedgefund:localdev@db:5432/openhedgefund
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./jobs/src:/app/src

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./ui/src:/app/src

volumes:
  pgdata:
